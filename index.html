<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Pour toi 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    font-family: 'Kalam', 'Comic Sans MS', cursive;
    background:
      linear-gradient(rgba(0,0,0,.10), rgba(0,0,0,.22)),
      url('papier.jpg') center / cover no-repeat fixed;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  .hint {
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 15px;
    line-height: 1.45;
    text-align: center;
    padding: 10px 16px;
    border-radius: 14px;
    max-width: 340px;
    backdrop-filter: blur(4px);
  }

  /* ---------- Post-it ---------- */
  .postit {
    position: relative;
    width: min(88vw, 340px);
    padding: 34px 22px 26px;
    background: linear-gradient(160deg, #fff7a1 0%, #ffef75 70%, #f9e966 100%);
    border-radius: 3px;
    box-shadow: 0 14px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    transform: rotate(-2.5deg);
  }
  .postit::before { /* scotch */
    content: '';
    position: absolute;
    top: -14px; left: 50%;
    width: 110px; height: 30px;
    transform: translateX(-50%) rotate(2deg);
    background: rgba(255,255,255,.45);
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .postit.shake { animation: shake .45s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(-2.5deg) translateX(0); }
    20% { transform: rotate(-2.5deg) translateX(-10px); }
    40% { transform: rotate(-2.5deg) translateX(9px); }
    60% { transform: rotate(-2.5deg) translateX(-6px); }
    80% { transform: rotate(-2.5deg) translateX(4px); }
  }

  .line {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 10px;
    margin: 6px 0;
    min-height: 42px;
  }

  .ink {
    font-family: 'Kalam', 'Comic Sans MS', cursive;
    font-weight: 700;
    color: #2b3a8f;
    font-size: clamp(22px, 6.5vw, 28px);
    letter-spacing: .04em;
  }

  input.word {
    font: inherit;
    color: inherit;
    text-align: center;
    background: rgba(255,255,255,.18);
    border: none;
    border-bottom: 2px dashed rgba(43,58,143,.45);
    border-radius: 0;
    outline: none;
    padding: 0 2px 2px;
    -webkit-appearance: none;
    appearance: none;
    caret-color: #2b3a8f;
    transition: background .2s, border-color .2s;
  }
  input.word:focus { background: rgba(255,255,255,.5); border-bottom-color: #2b3a8f; }
  input.word::placeholder { color: rgba(43,58,143,.25); }

  /* ---------- Emojis ---------- */
  .line.emojis { gap: 10px; margin-top: 10px; }
  .slot {
    width: 48px; height: 48px;
    font-size: 26px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.25);
    border: 2px dashed rgba(43,58,143,.45);
    border-radius: 50%;
    cursor: pointer;
    color: rgba(43,58,143,.5);
    font-family: 'Kalam', cursive;
  }
  .slot:active { transform: scale(.92); }

  /* ---------- Palette ---------- */
  .palette {
    position: fixed;
    left: 50%; bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(92vw, 360px);
    background: rgba(255,255,252,.97);
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    z-index: 20;
  }
  .palette[hidden] { display: none; }
  .palette button {
    font-size: 26px;
    padding: 8px 0;
    background: none;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .palette button:active { background: rgba(0,0,0,.08); }
  .palette .clear { font-size: 20px; color: #b00; }

  /* ---------- Bouton ---------- */
  .go {
    font-family: 'Kalam', cursive;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    background: rgba(0,0,0,.6);
    border: 2px solid rgba(255,255,255,.65);
    border-radius: 999px;
    padding: 12px 30px;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .go:active { transform: scale(.96); }

  .err {
    min-height: 22px;
    color: #fff;
    background: rgba(180,30,30,.75);
    font-size: 15px;
    padding: 4px 14px;
    border-radius: 10px;
    opacity: 0;
    transition: opacity .25s;
  }
  .err.show { opacity: 1; }

  /* ---------- Succès ---------- */
  .success {
    width: min(90vw, 340px);
    background: rgba(255,255,252,.96);
    border-radius: 20px;
    box-shadow: 0 16px 44px rgba(0,0,0,.5);
    padding: 28px 22px;
    text-align: center;
    transform: rotate(-1deg);
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .success[hidden] { display: none; }
  @keyframes pop { from { transform: rotate(-1deg) scale(.6); opacity: 0; } }

  .success h1 { font-size: 26px; color: #2b3a8f; margin-bottom: 6px; }
  .success p { font-size: 16px; color: #444; margin-bottom: 16px; }
  .success audio { width: 100%; margin-bottom: 14px; }
  .success a {
    display: inline-block;
    font-size: 15px;
    color: #2b3a8f;
    text-decoration: underline;
  }

  .emoji-fall {
    position: fixed;
    top: -8vh;
    font-size: 30px;
    z-index: 30;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(340deg); opacity: .9; }
  }
</style>
</head>
<body>

<div class="hint">🔒 Un message t'attend…<br>Recopie ce qui est écrit sur le post-it du cadeau&nbsp;!</div>

<form id="lock" autocomplete="off">
  <div class="postit" id="postit">
    <div class="line ink">
      <input class="word" id="w1" maxlength="4"  style="width:4.6ch"  placeholder="····"  enterkeyhint="next" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="mot 1">
      <input class="word" id="w2" maxlength="8"  style="width:8.6ch"  placeholder="········" enterkeyhint="next" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="mot 2">
    </div>
    <div class="line ink">
      <input class="word" id="w3" maxlength="6"  style="width:6.6ch"  placeholder="······" enterkeyhint="next" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="mot 3">
    </div>
    <div class="line ink">
      <input class="word" id="w4" maxlength="12" style="width:12.4ch" placeholder="············" enterkeyhint="done" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="mot 4">
    </div>
    <div class="line emojis">
      <button type="button" class="slot" data-i="0" aria-label="emoji 1">?</button>
      <button type="button" class="slot" data-i="1" aria-label="emoji 2">?</button>
      <button type="button" class="slot" data-i="2" aria-label="emoji 3">?</button>
      <button type="button" class="slot" data-i="3" aria-label="emoji 4">?</button>
      <button type="button" class="slot" data-i="4" aria-label="emoji 5">?</button>
    </div>
  </div>
</form>

<div class="err" id="err"></div>
<button class="go" id="go" type="submit" form="lock">🔓 Écouter le message</button>

<div class="palette" id="palette" hidden></div>

<div class="success" id="success" hidden>
  <h1>Joyeux anniversaire&nbsp;!&nbsp;🎉</h1>
  <p>Ferme les yeux… et écoute&nbsp;:</p>
  <audio id="player" src="message.m4a" controls playsinline preload="auto"></audio>
  <br>
  <a href="message.m4a" download>⬇️ Garder le message</a>
</div>

<audio id="preload" src="message.m4a" preload="auto" style="display:none"></audio>

<script>
const EXPECTED = '6f2f328fce79f798d03cb897db633b384795c4a33d1c37791a73bc64be513d85';
const EMOJIS = ['🎈','🎂','🎉','🎁','💐','🥳','🍾','❤️','🌸','⭐','🎊','🍰'];

const words = ['w1','w2','w3','w4'].map(id => document.getElementById(id));
const slots = [...document.querySelectorAll('.slot')];
const picked = [null, null, null, null, null];
const palette = document.getElementById('palette');
const err = document.getElementById('err');
const postit = document.getElementById('postit');
let activeSlot = 0;

// --- auto-avance quand un mot est complet + capitalisation façon post-it ---
words.forEach((w, i) => {
  w.addEventListener('input', () => {
    if (i === 1) w.value = w.value.toUpperCase();              // AMANDINE tout en majuscules
    else if (w.value) w.value = w.value[0].toUpperCase() + w.value.slice(1);
    if (w.value.length >= +w.maxLength && i < words.length - 1) words[i + 1].focus();
  });
});

// --- palette emojis ---
EMOJIS.forEach(e => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = e;
  b.onclick = () => pickEmoji(e);
  palette.appendChild(b);
});
const clearBtn = document.createElement('button');
clearBtn.type = 'button';
clearBtn.textContent = '⌫';
clearBtn.className = 'clear';
clearBtn.onclick = () => pickEmoji(null);
palette.appendChild(clearBtn);

slots.forEach(s => s.onclick = () => {
  activeSlot = +s.dataset.i;
  palette.hidden = false;
});
function pickEmoji(e) {
  picked[activeSlot] = e;
  slots[activeSlot].textContent = e || '?';
  palette.hidden = true;
  const next = picked.findIndex(p => !p);
  if (next >= 0 && e) { activeSlot = next; palette.hidden = false; }
}
document.addEventListener('click', ev => {
  if (!palette.hidden && !palette.contains(ev.target) && !ev.target.classList.contains('slot'))
    palette.hidden = true;
});

// --- validation ---
const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
const hex = buf => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');

function fail(msg) {
  err.textContent = msg;
  err.classList.add('show');
  postit.classList.remove('shake');
  void postit.offsetWidth;
  postit.classList.add('shake');
  setTimeout(() => err.classList.remove('show'), 2600);
}

document.getElementById('lock').addEventListener('submit', async ev => {
  ev.preventDefault();
  palette.hidden = true;
  if (words.some(w => !w.value.trim()) || picked.some(p => !p))
    return fail('Il manque des mots ou des emojis… 👀');

  const answer = words.map(w => norm(w.value)).join(' ') + ' ' + picked.join('');
  const h = hex(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(answer)));
  if (h !== EXPECTED) return fail('Hmm, ce n\'est pas tout à fait ça… 🤔');

  // succès — le tap sur le bouton autorise la lecture audio sur iOS
  document.getElementById('go').style.display = 'none';
  document.querySelector('.hint').style.display = 'none';
  postit.parentElement.style.display = 'none';
  err.style.display = 'none';
  document.getElementById('success').hidden = false;
  confetti();
  const player = document.getElementById('player');
  player.play().catch(() => {});
});

function confetti() {
  const set = ['🎉','🎈','🎂','✨','🎊','💛'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.className = 'emoji-fall';
    s.textContent = set[Math.floor(Math.random() * set.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 20 + Math.random() * 22 + 'px';
    s.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
    s.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}
</script>
</body>
</html>
