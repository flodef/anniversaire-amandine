<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>À toi de jouer 🔐</title>
<meta property="og:title" content="À toi de jouer 🔐">
<meta property="og:description" content="Un petit message bien gardé t'attend…">
<meta property="og:type" content="website">
<meta property="og:url" content="https://amandine.fims.fi/">
<meta property="og:image" content="https://amandine.fims.fi/preview.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
    font-family: 'Kalam', 'Comic Sans MS', cursive;
    background:
      linear-gradient(rgba(0,0,0,.10), rgba(0,0,0,.22)),
      url('papier.jpg') center / cover no-repeat fixed;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }

  @media (min-width: 700px) {
    body {
      background:
        linear-gradient(rgba(0,0,0,.10), rgba(0,0,0,.22)),
        url('papier-tile.jpg') repeat fixed;
      background-size: auto, 840px auto;
    }
  }

  /* ---------- Post-it ---------- */
  .postit {
    position: relative;
    width: min(84vw, 300px);
    padding: 28px 16px 20px;
    background: linear-gradient(160deg, #fff7a1 0%, #ffef75 70%, #f9e966 100%);
    border-radius: 3px;
    box-shadow: 0 14px 30px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
    transform: rotate(-2.5deg);
  }
  .postit::before { /* scotch */
    content: '';
    position: absolute;
    top: -13px; left: 50%;
    width: 100px; height: 27px;
    transform: translateX(-50%) rotate(2deg);
    background: rgba(255,255,255,.45);
    box-shadow: 0 1px 3px rgba(0,0,0,.15);
  }
  .postit { animation: fadein .5s ease .1s backwards; }
  @keyframes fadein { from { opacity: 0; } }

  .postit.shake { animation: shake .45s ease; }
  @keyframes shake {
    0%,100% { transform: rotate(-2.5deg) translateX(0); }
    20% { transform: rotate(-2.5deg) translateX(-10px); }
    40% { transform: rotate(-2.5deg) translateX(9px); }
    60% { transform: rotate(-2.5deg) translateX(-6px); }
    80% { transform: rotate(-2.5deg) translateX(4px); }
  }

  .line {
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 8px;
    margin: 3px 0;
    min-height: 38px;
  }

  .ink {
    font-family: 'Kalam', 'Comic Sans MS', cursive;
    font-weight: 700;
    color: #2b3a8f;
    font-size: clamp(20px, 5.8vw, 26px);
    letter-spacing: .02em;
  }

  input.word {
    font: inherit;
    color: inherit;
    text-align: center;
    background: rgba(255,255,255,.45);
    border: none;
    border-radius: 5px;
    outline: none;
    padding: 0 2px 2px;
    -webkit-appearance: none;
    appearance: none;
    caret-color: #2b3a8f;
    transition: background .2s;
  }
  input.word:focus { background: rgba(255,255,255,.7); }
  input.word.filled { background: none; }
  input.word.filled:focus { background: rgba(255,255,255,.3); }
  input.word.locked {
    cursor: default;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #bang { margin-left: 2px; }

  /* ---------- Emojis ---------- */
  .line.emojis { gap: 0; margin-top: 8px; align-items: center; visibility: hidden; }
  .line.emojis.show { visibility: visible; animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
  .slot {
    position: relative;
    width: 42px; height: 42px;
    font-size: 26px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,.45);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    font-family: 'Kalam', cursive;
    padding: 0;
    transition: background .2s;
  }
  .slot::before { /* zone de clic étendue : les zones se chevauchent, pas de trou */
    content: '';
    position: absolute;
    inset: -4px;
  }
  .slot:active { transform: scale(.92); }
  .slot.filled { background: none; font-size: 34px; }
  .slot.locked { cursor: default; }
  .slot[data-i="3"], .slot[data-i="4"] { margin-left: 14px; }

  /* ---------- Tooltip palette ---------- */
  .palette {
    position: fixed;
    background: rgba(255,255,252,.97);
    border-radius: 16px;
    box-shadow: 0 10px 34px rgba(0,0,0,.5);
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(6, 44px);
    gap: 4px;
    z-index: 20;
  }
  .palette[hidden] { display: none; }
  .palette::after {
    content: '';
    position: absolute;
    left: var(--arrow-x, 50%);
    transform: translateX(-50%);
    border: 9px solid transparent;
  }
  .palette:not(.above)::after { top: -17px; border-bottom-color: rgba(255,255,252,.97); }
  .palette.above::after { bottom: -17px; border-top-color: rgba(255,255,252,.97); }
  .palette button {
    font-size: 26px;
    padding: 8px 0;
    background: none;
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  .palette button:active { background: rgba(0,0,0,.08); }

  /* ---------- Erreur ---------- */
  .err {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    background: rgba(180,30,30,.85);
    padding: 6px 16px;
    border-radius: 12px;
    opacity: 0;
    transition: opacity .25s;
    max-width: 94vw;
    font-size: 14px;
    text-align: center;
    text-wrap: balance;
    pointer-events: none;
    z-index: 25;
  }
  .err.show { opacity: 1; }

  body.unlocked {
    background: url('plage.jpg') center / cover no-repeat fixed;
  }

  #turtle {
    width: min(58vw, 230px);
    transform: rotate(-5deg);
    filter: drop-shadow(0 10px 12px rgba(90,60,20,.45));
    animation: pop .6s cubic-bezier(.2,1.6,.4,1) .15s backwards;
  }
  #turtle[hidden] { display: none; }

  /* ---------- Popup indice ---------- */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 50;
  }
  .modal[hidden] { display: none; }
  .modal-card {
    background: #fffef5;
    border-radius: 18px;
    box-shadow: 0 16px 44px rgba(0,0,0,.5);
    padding: 24px 20px;
    width: min(82vw, 290px);
    text-align: center;
    font-size: 19px;
    color: #333;
    animation: pop .4s cubic-bezier(.2,1.6,.4,1);
  }
  .modal-card p { margin-bottom: 14px; }
  .btn {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 16px;
    padding: 9px 18px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
  }
  .btn:active { transform: scale(.95); }
  .btn-yes { background: #2b3a8f; color: #fff; }
  .btn-no { background: rgba(43,58,143,.12); color: #2b3a8f; }
  .modal-btns { display: flex; gap: 10px; justify-content: center; }

  /* ---------- Page indice (plage de nuit) ---------- */
  #hints {
    position: fixed; inset: 0;
    z-index: 40;
    background:
      linear-gradient(rgba(10,14,55,.5), rgba(5,8,40,.78)),
      url('plage.jpg') center / cover no-repeat;
    display: flex; flex-direction: column; align-items: center;
  }
  #hints[hidden] { display: none; }
  .sea {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 36%;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    width: 3px; height: 3px;
    border-radius: 50%;
    background: #dff1ff;
    box-shadow: 0 0 6px 1px rgba(200,230,255,.9);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.5); }
    50% { opacity: 1; transform: scale(1.15); }
  }
  #hintLines {
    margin-top: 48vh;
    color: #fff;
    font-size: clamp(16px, 4.6vw, 21px);
    font-weight: 700;
    text-align: center;
    min-height: 5.5em;
    text-shadow: 0 2px 10px rgba(0,0,0,.55);
    padding: 0 12px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .hint-line { white-space: nowrap; }
  .hint-line.typing::after {
    content: '';
    display: inline-block;
    width: 2px; height: .9em;
    background: #fff;
    margin-left: 3px;
    vertical-align: -.1em;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .hint-btns {
    margin-top: auto;
    margin-bottom: calc(28px + env(safe-area-inset-bottom));
    display: flex; gap: 12px;
  }
  .hint-btns .btn {
    background: rgba(255,255,255,.16);
    color: #fff;
    border: 1px solid rgba(255,255,255,.55);
    backdrop-filter: blur(6px);
  }

  /* ---------- Succès ---------- */
  .success {
    width: min(90vw, 340px);
    background: rgba(255,255,252,.96);
    border-radius: 20px;
    box-shadow: 0 16px 44px rgba(0,0,0,.5);
    padding: 28px 22px;
    text-align: center;
    transform: rotate(-1deg);
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .success[hidden] { display: none; }
  @keyframes pop { from { transform: rotate(-1deg) scale(.6); opacity: 0; } }

  .success h1 { font-size: 26px; color: #2b3a8f; margin-bottom: 6px; }
  .success p { font-size: 16px; color: #444; margin-bottom: 16px; }
  .success audio { width: 100%; margin-bottom: 14px; }
  .success a {
    display: inline-block;
    font-size: 15px;
    color: #2b3a8f;
    text-decoration: underline;
  }

  .emoji-fall {
    position: fixed;
    top: -8vh;
    font-size: 30px;
    z-index: 30;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(115vh) rotate(340deg); opacity: .9; }
  }
</style>
</head>
<body>

<form id="lock" autocomplete="off">
  <div class="postit" id="postit">
    <div class="line ink">
      <input type="text" class="word" id="w1" maxlength="4"  style="width:5ch"    enterkeyhint="next" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="mot 1">
      <input type="text" class="word" id="w2" maxlength="8"  style="width:10.5ch" enterkeyhint="next" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="mot 2">
    </div>
    <div class="line ink">
      <input type="text" class="word" id="w3" maxlength="6"  style="width:7.5ch"  enterkeyhint="next" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="mot 3">
    </div>
    <div class="line ink">
      <input type="text" class="word" id="w4" maxlength="12" style="width:14ch"   enterkeyhint="done" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" aria-label="mot 4"><span id="bang" hidden>!!</span>
    </div>
    <div class="line emojis">
      <button type="button" class="slot" data-i="0" aria-label="emoji 1"></button>
      <button type="button" class="slot" data-i="1" aria-label="emoji 2"></button>
      <button type="button" class="slot" data-i="2" aria-label="emoji 3"></button>
      <button type="button" class="slot" data-i="3" aria-label="emoji 4"></button>
      <button type="button" class="slot" data-i="4" aria-label="emoji 5"></button>
    </div>
  </div>
</form>

<div class="err" id="err"></div>
<div class="palette" id="palette" hidden></div>

<img id="turtle" data-src="tortue.png" alt="tortue en origami" hidden>

<div class="success" id="success" hidden>
  <h1>Joyeux anniversaire&nbsp;!&nbsp;🎉</h1>
  <p>Ça t'évitera de disséquer encore un autre animal en papier 😜</p>
  <audio id="player" src="à ma ama aimée.m4a" controls playsinline preload="none"></audio>
  <br>
  <a href="à ma ama aimée.m4a" download>⬇️ pour si tu veux le réécouter…</a>
</div>

<div class="modal" id="hintPrompt" hidden>
  <div class="modal-card">
    <p>Tu veux un petit indice&nbsp;? 🗝️</p>
    <div class="modal-btns">
      <button class="btn btn-no" id="hintNo">Non 💪</button>
      <button class="btn btn-yes" id="hintYes">Oui 🙏</button>
    </div>
  </div>
</div>

<div id="hints" hidden>
  <div class="sea" id="sea"></div>
  <div id="hintLines"></div>
  <div class="hint-btns">
    <button class="btn" id="hintBack">J'ai trouvé !</button>
    <button class="btn" id="hintNext">Un autre stp</button>
  </div>
</div>

<script>
const WORD_HASHES = [
  'ed29bcecc78d7ffb672491c9440a4159f9aa81182f5b1fc32726a96ec10e0392', // Pour
  '6374f5d8c2d3a9a572d4d00f1ac505e3d097c96560734c0488f23c6515afcbb8', // AMANDINE
  'a4990bfdb3196fae64f66b646bc73f6cd1a2f115d5aad4d2bae0fb09bca7b1c8', // Joyeux
  '542731404f186dfe16a7acd23cfaf6ff4eb53e15e71e12a4dc05963ba74eff46', // Anniversaire
];
const EMOJI_HASHES = [
  '340ac0a3add29c1b128c72471294ed62196d634525d73bf88e5028e81aa5d378',
  '340ac0a3add29c1b128c72471294ed62196d634525d73bf88e5028e81aa5d378',
  '340ac0a3add29c1b128c72471294ed62196d634525d73bf88e5028e81aa5d378',
  '23816c185bc1b04ffc0b4c0eb718c32dfd764adc33baf363fbf9bea8144a46ec',
  '6146299cd54818a0e659eb6ac88e80f6f8f70536bbbd962d36973f2d2323f26c',
];
const EMOJIS = ['🎁','💐','⭐','🎂','🥳','🌸','🎈','🎊','❤️','🍾','🍰','🎉'];

const words = ['w1','w2','w3','w4'].map(id => document.getElementById(id));
const slots = [...document.querySelectorAll('.slot')];
const wordOk = [false, false, false, false];
const emojiOk = [false, false, false, false, false];
const picked = [null, null, null, null, null];
const palette = document.getElementById('palette');
const err = document.getElementById('err');
const postit = document.getElementById('postit');
let activeSlot = 0;

const norm = s => s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))]
  .map(b => b.toString(16).padStart(2, '0')).join('');

const FAIL_MSGS = [
  'Hmm, ce n\'est pas tout à fait ça… 🤔',
  'Essaie encore 😜',
  'Tu y es presque… ou pas 😏',
  'Allez James Bond 🕵️',
  'Imagine si c\'était une bombe à désamorcer 💣',
  'C\'est pire que des chiffres et des lettres 🔤',
  'C\'est comme ça que je vais t\'embaucher ? 🧐',
  'On dirait une apprentie hackeuse 🤓',
  'Oulà, rappelle-toi tes cours de français ! 👩‍🏫',
];
let failPool = [];
let fails = 0;
let errTimer = null;

function fail() {
  if (!failPool.length) failPool = [...FAIL_MSGS].sort(() => Math.random() - .5);
  if (++fails % 10 === 0) document.getElementById('hintPrompt').hidden = false;
  const r = postit.getBoundingClientRect();
  err.style.top = Math.min(r.bottom + 8, innerHeight - 56) + 'px';
  err.textContent = failPool.pop();
  err.classList.remove('show');
  void err.offsetWidth;
  err.classList.add('show');
  postit.classList.remove('shake');
  void postit.offsetWidth;
  postit.classList.add('shake');
  clearTimeout(errTimer);
  errTimer = setTimeout(() => err.classList.remove('show'), 2600);
}

// --- recentrer le post-it dans la zone visible quand le clavier s'ouvre ---
function centerPostit() {
  setTimeout(() => postit.scrollIntoView({ block: 'center', behavior: 'smooth' }), 320);
}
if (window.visualViewport) {
  visualViewport.addEventListener('resize', () => {
    if (document.activeElement?.classList.contains('word')) centerPostit();
  });
}

// --- saisie : capitalisation, indicateur qui s'efface, verrouillage ---
words.forEach((w, i) => {
  w.addEventListener('focus', centerPostit);
  w.addEventListener('input', async () => {
    if (wordOk[i]) return;
    const clean = w.value.replace(/\P{L}/gu, '').slice(0, +w.maxLength);
    w.value = i === 1 ? clean.toUpperCase() : (clean ? clean[0].toUpperCase() + clean.slice(1) : '');
    w.classList.toggle('filled', !!w.value);
    if (w.value.length < +w.maxLength) return;
    if (await sha(norm(w.value)) !== WORD_HASHES[i]) return fail();
    wordOk[i] = true;
    w.readOnly = true;
    w.tabIndex = -1;
    w.classList.add('locked');
    if (i < words.length - 1) words[i + 1].focus(); else w.blur();
    if (wordOk.every(Boolean)) {
      document.getElementById('bang').hidden = false;
      document.querySelector('.line.emojis').classList.add('show');
    }
    maybeUnlock();
  });
  w.addEventListener('compositionupdate', () => {
    if (w.value.length > +w.maxLength) w.value = w.value.slice(0, +w.maxLength);
  });
  // champ plein : le caractère tapé remplace la dernière lettre (abcd + e -> abce)
  // règle aussi le "fantome" IME mobile (ev.data contient le caractère même non inséré)
  w.addEventListener('beforeinput', ev => {
    if (wordOk[i] || ev.inputType.startsWith('delete') || w.value.length < +w.maxLength) return;
    ev.preventDefault();
    const ch = (ev.data || '').replace(/\P{L}/gu, '').slice(-1);
    if (!ch) return;
    w.value = w.value.slice(0, +w.maxLength - 1) + ch;
    w.dispatchEvent(new Event('input'));
  });
  w.addEventListener('keydown', ev => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      i < words.length - 1 ? words[i + 1].focus() : w.blur();
    }
  });
});

// --- palette emojis en tooltip ---
EMOJIS.forEach(e => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = e;
  b.onclick = () => pickEmoji(e);
  palette.appendChild(b);
});

function openPalette(slot) {
  activeSlot = +slot.dataset.i;
  if (document.activeElement?.classList.contains('word')) document.activeElement.blur();
  palette.hidden = false;
  const r = slot.getBoundingClientRect();
  const pw = palette.offsetWidth, ph = palette.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, innerWidth - pw - 8));
  let top = r.bottom + 14;
  let above = false;
  if (top + ph > innerHeight - 8) { top = r.top - ph - 14; above = true; }
  palette.style.left = left + 'px';
  palette.style.top = top + 'px';
  palette.classList.toggle('above', above);
  palette.style.setProperty('--arrow-x', (r.left + r.width / 2 - left) + 'px');
}

slots.forEach(s => s.onclick = () => { if (!emojiOk[+s.dataset.i]) openPalette(s); });

async function pickEmoji(e) {
  const i = activeSlot;
  if (emojiOk[i]) return;
  if (picked[i] === e) return;           // même emoji déjà choisi : rien de plus
  picked[i] = e;
  const s = slots[i];
  s.textContent = e;
  s.classList.add('filled');
  if (await sha(e) !== EMOJI_HASHES[i]) { fail(); return openPalette(s); }
  emojiOk[i] = true;
  s.classList.add('locked');
  const next = emojiOk.findIndex(ok => !ok);
  if (next >= 0) openPalette(slots[next]);
  else palette.hidden = true;
  maybeUnlock();
}

document.addEventListener('click', ev => {
  if (!palette.hidden && !palette.contains(ev.target) && !ev.target.classList.contains('slot'))
    palette.hidden = true;
});

// --- succès quand tout est verrouillé ---
function maybeUnlock() {
  if (!wordOk.every(Boolean) || !emojiOk.every(Boolean)) return;
  palette.hidden = true;
  postit.parentElement.style.display = 'none';
  document.body.classList.add('unlocked');
  err.style.display = 'none';
  document.getElementById('turtle').hidden = false;
  document.getElementById('success').hidden = false;
  confetti();
  document.getElementById('player').play().catch(() => {});
}

document.getElementById('lock').addEventListener('submit', ev => ev.preventDefault());

// --- indices : plage de nuit + lucioles ---
const HINTS = [
  'Dans le royaume des lucioles de mer',
  'Un lutin est venu déposer avant-hier',
  'Une missive en ta demeure sans lumière',
];
const hints = document.getElementById('hints');
const hintLines = document.getElementById('hintLines');
const hintNext = document.getElementById('hintNext');
let nextHint = 0, typeTimer = null;

const sea = document.getElementById('sea');
for (let i = 0; i < 30; i++) {
  const s = document.createElement('span');
  s.className = 'sparkle';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDuration = (1.4 + Math.random() * 2.6) + 's';
  s.style.animationDelay = (Math.random() * 3) + 's';
  sea.appendChild(s);
}

function renderHint(i, instant) {
  const p = document.createElement('p');
  p.className = 'hint-line' + (instant ? '' : ' typing');
  hintLines.appendChild(p);
  const txt = HINTS[i];
  if (instant) { p.textContent = txt; return; }
  let c = 0;
  clearInterval(typeTimer);
  typeTimer = setInterval(() => {
    p.textContent = txt.slice(0, ++c);
    if (c >= txt.length) { clearInterval(typeTimer); p.classList.remove('typing'); }
  }, 55);
}

function refreshNextBtn() {
  hintNext.style.display = nextHint < HINTS.length ? '' : 'none';
}

function openHints() {
  hints.hidden = false;
  hintLines.innerHTML = '';
  for (let i = 0; i < nextHint; i++) renderHint(i, true);
  if (nextHint < HINTS.length) renderHint(nextHint++);
  refreshNextBtn();
}

document.getElementById('hintYes').onclick = () => {
  document.getElementById('hintPrompt').hidden = true;
  document.activeElement?.blur();
  openHints();
};
document.getElementById('hintNo').onclick = () => { document.getElementById('hintPrompt').hidden = true; };
document.getElementById('hintBack').onclick = () => { hints.hidden = true; clearInterval(typeTimer); };
hintNext.onclick = () => { if (nextHint < HINTS.length) renderHint(nextHint++); refreshNextBtn(); };

// --- préchargement en tâche de fond (après affichage papier + post-it) ---
window.addEventListener('load', () => {
  const p = document.getElementById('player');
  p.preload = 'auto'; p.load();
  const t = document.getElementById('turtle');
  t.src = t.dataset.src;
  new Image().src = 'plage.jpg';
});

function confetti() {
  const set = ['🎉','🎈','🎂','✨','🎊','💛'];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement('span');
    s.className = 'emoji-fall';
    s.textContent = set[Math.floor(Math.random() * set.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.fontSize = 20 + Math.random() * 22 + 'px';
    s.style.animationDuration = 2.2 + Math.random() * 1.8 + 's';
    s.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }
}
</script>
